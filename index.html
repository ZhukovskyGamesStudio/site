<style>
:root{--bg:#2A324B;--acc:#FF8A3D;--txt:#FFF6EA;--muted:#C9CFE0;--line:#3A4463}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Jost,system-ui,sans-serif;font-weight:400;line-height:1.55;font-size:18px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:var(--txt);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:15px}
.brand img{width:44px;height:44px}
nav{display:flex;gap:22px;align-items:center;font-weight:500;font-size:15px;letter-spacing:.5px}
nav a{color:var(--muted)}nav a:hover{color:var(--txt);text-decoration:none}
.lang{border:1px solid var(--line);border-radius:999px;padding:4px 6px;display:flex;gap:2px}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-weight:500;padding:2px 10px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--acc);color:var(--bg)}
.hero{padding:28px 0 8px}
.hero svg{display:block;width:100%;max-width:820px;height:auto;margin:0 auto;cursor:pointer}
section{padding:64px 0 8px}
h2{font-weight:700;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);margin:0 0 22px}
.about p{max-width:760px;margin:0 0 14px;font-size:20px}
.about .lead{font-weight:500;font-size:22px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:420px}
.card .art{height:180px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#222A40;overflow:hidden}
.card .art img{max-height:160px;max-width:88%}
.card .art.cover img{max-height:none;max-width:none;width:100%;height:100%;object-fit:cover}
.card .art.ph{background:repeating-linear-gradient(135deg,#222A40 0 10px,#26304A 10px 20px)}
.card .art.ph svg{width:120px;opacity:.55}
.status{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500}
.card h3{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.card p{margin:0;color:var(--muted);font-size:16px;flex:1}
.btn{display:inline-block;background:var(--acc);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:10px;font-size:15px;letter-spacing:.5px}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.team{display:flex;gap:40px;flex-wrap:wrap}
.person b{display:block;font-size:20px;font-weight:700}.person span{color:var(--muted)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.links a{border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--txt);font-weight:500;font-size:15px}
.links a:hover{border-color:var(--acc);text-decoration:none}
footer{padding:48px 0 40px;color:var(--muted);font-size:15px;border-top:1px solid var(--line);margin-top:64px}
footer p{margin:6px 0}
footer .meme{margin:0 0 26px;max-width:640px;font-size:15px;color:var(--muted);font-style:italic}
footer .meme small{font-style:normal;font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
@media (max-width:820px){.games{grid-template-columns:1fr}.card{min-height:0}nav{display:none}body{font-size:17px}.about p{font-size:18px}.about .lead{font-size:20px}}
</style>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const back=t=>{const s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);},easeOut=t=>1-Math.pow(1-t,3),easeOutQuint=t=>1-Math.pow(1-t,5),easeOutQuart=t=>1-Math.pow(1-t,4),easeInOutSine=t=>-(Math.cos(Math.PI*t)-1)/2;

function render(t){
  const p=seg(t,0,T_FLY),u=easeOutQuint(p),pos=bez(u),d=dbez(u);

}

(function loop(now){const t=now-t0;render(Math.min(t,HOLD+((t>HOLD)?(t-HOLD):0)));requestAnimationFrame(loop);})(t0);
